name: proyecto-novedades-prod

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-proyecto_novedades}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-proyecto_novedades}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    build:
      context: ./proyecto-novedades
      dockerfile: Dockerfile
    command: ["node", "scripts/docker-bootstrap-db.js"]
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-proyecto_novedades}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./proyecto-novedades
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-proyecto_novedades}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET es obligatorio en producción}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      BCRYPT_COST: ${BCRYPT_COST:-12}
      CORS_ORIGIN_DEV: ${CORS_ORIGIN_DEV:-http://localhost}
      CORS_ORIGIN_PROD: ${CORS_ORIGIN_PROD:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_DOMINIO_PERMITIDO: ${GOOGLE_DOMINIO_PERMITIDO:-uniautonoma.edu.co}
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
    volumes:
      - api_uploads_prod:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ./Front_Novedades
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api

volumes:
  pgdata_prod:
  api_uploads_prod:
